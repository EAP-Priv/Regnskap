<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Regnskap">
<meta name="theme-color" content="#f7f6f2">
<title>Personlig Regnskap</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f6f2;color:#111;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:780px;margin:0 auto;padding:1.5rem 1rem 4rem}
h1{font-size:22px;font-weight:600;margin-bottom:2px}
.subtitle{font-size:13px;color:#888;margin-bottom:1.5rem}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:1.5rem}
.topbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input{font-family:inherit;font-size:13px;border:0.5px solid #d0d0d0;border-radius:8px;padding:7px 10px;background:#fff;color:#111;outline:none}
select:focus,input:focus{border-color:#888}
.btn{font-family:inherit;font-size:13px;font-weight:500;border-radius:8px;padding:8px 14px;cursor:pointer;border:0.5px solid #d0d0d0;background:#fff;color:#111;transition:background .12s,opacity .12s}
.btn:hover{background:#f0efe9}
.btn.primary{background:#111;color:#fff;border-color:#111}
.btn.primary:hover{opacity:.85}
.btn.success{background:#1D9E75;color:#fff;border-color:#1D9E75}
.btn.success:hover{opacity:.85}
.btn.danger-outline{color:#E24B4A;border-color:#E24B4A}
.btn.danger-outline:hover{background:#fff5f5}
.btn.sm{padding:4px 10px;font-size:12px}
.tabs{display:flex;border-bottom:0.5px solid #e0e0e0;margin-bottom:1.5rem;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 16px;font-size:14px;cursor:pointer;color:#888;font-family:inherit;font-weight:400;margin-bottom:-1px;transition:all .12s;white-space:nowrap}
.tab.active{color:#111;border-bottom-color:#111;font-weight:500}
.tab:hover:not(.active){color:#111}
.card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card-title{font-size:12px;font-weight:500;color:#888;margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.metric{background:#f5f4f0;border-radius:8px;padding:13px 14px}
.metric-label{font-size:11px;color:#888;margin-bottom:4px}
.metric-value{font-size:19px;font-weight:500}
.metric-value.green{color:#1D9E75}
.metric-value.red{color:#E24B4A}
.metric-value.amber{color:#BA7517}
.metric-value.blue{color:#185FA5}
.metric-value.purple{color:#534AB7}
.accounts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:16px}
.account-card{background:#fff;border:0.5px solid #e0e0e0;border-radius:10px;padding:12px 14px}
.account-card .acc-name{font-size:11px;color:#888;margin-bottom:2px}
.account-card .acc-bal{font-size:17px;font-weight:500}
.account-card .acc-sub{font-size:11px;color:#aaa;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;font-size:11px;font-weight:500;color:#888;border-bottom:0.5px solid #e8e8e8;white-space:nowrap}
td{padding:9px 10px;border-bottom:0.5px solid #f2f2f2;vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.diff-pos{color:#E24B4A;font-weight:500}
.diff-neg{color:#1D9E75;font-weight:500}
.form-grid{display:grid;gap:10px;margin-bottom:10px}
.form-grid.g2{grid-template-columns:1fr 1fr}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr}
label.field-label{font-size:12px;color:#888;display:block;margin-bottom:4px}
.field input,.field select{width:100%}
.inline-edit{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.inline-edit input{padding:5px 8px;width:90px}
.lønn-bar{background:#f5f4f0;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.auto-trekk-bar{background:#EAF3DE;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.auto-trekk-bar label{font-size:13px;color:#3B6D11;font-weight:500}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.toggle input[type=checkbox]{width:16px;height:16px;accent-color:#1D9E75;cursor:pointer}
.empty-state{color:#aaa;font-size:13px;text-align:center;padding:2rem 0}
.chip{display:inline-flex;align-items:center;gap:4px;background:#f0efe9;border-radius:6px;padding:3px 8px;font-size:12px;color:#555}
.acc-input-row{display:flex;align-items:center;gap:8px}
.acc-input-row input{width:130px}

/* ── LOCK SCREEN ── */
#lockscreen{position:fixed;inset:0;background:#f7f6f2;display:flex;align-items:center;justify-content:center;z-index:999;padding:1rem}
.lock-box{background:#fff;border:0.5px solid #e0e0e0;border-radius:20px;padding:2rem 2rem;width:100%;max-width:340px;text-align:center}
.lock-icon{font-size:40px;margin-bottom:14px}
.lock-box h2{font-size:18px;font-weight:600;margin-bottom:6px}
.lock-box p{font-size:13px;color:#888;margin-bottom:1.5rem;line-height:1.5}
.lock-box input{width:100%;margin-bottom:10px;padding:10px 12px;font-size:15px;letter-spacing:.15em;text-align:center;border-radius:8px;border:0.5px solid #d0d0d0}
.lock-box .btn{width:100%;padding:11px;font-size:14px;margin-bottom:8px}
.lock-error{color:#E24B4A;font-size:13px;margin-top:6px;min-height:18px}
.lock-divider{display:flex;align-items:center;gap:10px;margin:12px 0;color:#ccc;font-size:12px}
.lock-divider::before,.lock-divider::after{content:'';flex:1;border-top:0.5px solid #e0e0e0}
.faceid-btn{background:#f5f4f0;border:0.5px solid #e0e0e0;border-radius:12px;padding:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;color:#111;margin-bottom:8px}
.faceid-btn:hover{background:#eeeee8}

/* ── INSTALL BANNER ── */
.install-banner{background:#E6F1FB;border:0.5px solid #B5D4F4;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#185FA5;display:flex;justify-content:space-between;align-items:center;gap:10px}

@media(max-width:500px){
  .form-grid.g3{grid-template-columns:1fr 1fr}
  .form-grid.g2{grid-template-columns:1fr}
  th:nth-child(4),td:nth-child(4){display:none}
}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockscreen">
  <div class="lock-box">
    <div class="lock-icon" id="lock-icon">🔒</div>
    <h2 id="lock-title">Personlig regnskap</h2>
    <p id="lock-desc">Lås opp med Face ID eller passord.</p>
    <div id="faceid-section"></div>
    <div id="pw-section"></div>
    <div class="lock-error" id="lock-error"></div>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="main-app" style="display:none">
  <div class="topbar">
    <div>
      <h1>Personlig regnskap</h1>
      <div class="subtitle" id="subtitle-month"></div>
    </div>
    <div class="topbar-right">
      <select id="month-picker"></select>
      <button class="btn sm" title="Lås" onclick="lockApp()">🔒</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="setTab('oversikt',this)">Oversikt</button>
    <button class="tab" onclick="setTab('avsetninger',this)">Avsetninger</button>
    <button class="tab" onclick="setTab('kontoer',this)">Kontoer</button>
    <button class="tab" onclick="setTab('aar',this)">År</button>
    <button class="tab" onclick="setTab('innstillinger',this)">⚙️</button>
  </div>
  <div id="content"></div>
</div>

<script>
// ── HASH ──────────────────────────────────────────────────────────────────
function simpleHash(str){
  let h=5381;
  for(let i=0;i<str.length;i++) h=((h<<5)+h)^str.charCodeAt(i);
  return(h>>>0).toString(36);
}

// ── STORAGE KEYS ──────────────────────────────────────────────────────────
const LS_DATA='regnskap_data_v1';
const LS_PW='regnskap_pw_v1';
const LS_FACEID='regnskap_faceid_v1';

let unlocked=false;
let faceIdAvailable=false;
let faceIdRegistered=localStorage.getItem(LS_FACEID)==='true';

// ── FACE ID / WEBAUTHN ────────────────────────────────────────────────────
function strToAb(str){const b=new TextEncoder().encode(str);return b.buffer;}
function abToB64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)));}
function b64ToAb(b64){const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr.buffer;}

async function checkFaceIdAvailable(){
  try{
    if(!window.PublicKeyCredential) return false;
    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
  }catch{return false;}
}

async function registerFaceId(){
  try{
    const challenge=new Uint8Array(32);crypto.getRandomValues(challenge);
    const cred=await navigator.credentials.create({publicKey:{
      challenge,
      rp:{name:'Personlig Regnskap',id:location.hostname||'localhost'},
      user:{id:strToAb('regnskap-user'),name:'bruker',displayName:'Regnskap bruker'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
      timeout:60000,
    }});
    localStorage.setItem(LS_FACEID,'true');
    localStorage.setItem('regnskap_credid',abToB64(cred.rawId));
    faceIdRegistered=true;
    return true;
  }catch(e){
    console.log('FaceID reg error:',e);
    return false;
  }
}

async function verifyFaceId(){
  try{
    const challenge=new Uint8Array(32);crypto.getRandomValues(challenge);
    const credId=localStorage.getItem('regnskap_credid');
    const opts={publicKey:{
      challenge,
      rpId:location.hostname||'localhost',
      userVerification:'required',
      timeout:60000,
    }};
    if(credId) opts.publicKey.allowCredentials=[{type:'public-key',id:b64ToAb(credId),transports:['internal']}];
    await navigator.credentials.get(opts);
    return true;
  }catch(e){
    console.log('FaceID verify error:',e);
    return false;
  }
}

// ── AUTH INIT ─────────────────────────────────────────────────────────────
async function initLockScreen(){
  faceIdAvailable=await checkFaceIdAvailable();
  const pwHash=localStorage.getItem(LS_PW);
  const faceSection=document.getElementById('faceid-section');
  const pwSection=document.getElementById('pw-section');
  const desc=document.getElementById('lock-desc');
  const title=document.getElementById('lock-title');

  if(!pwHash){
    // First time setup
    title.textContent='Velg et passord';
    desc.textContent='Første gang du åpner appen. Velg et passord — dataene dine lagres kun på denne telefonen.';
    faceSection.innerHTML='';
    pwSection.innerHTML=`
      <input type="password" id="pw-input" placeholder="Velg passord (min. 4 tegn)" onkeydown="if(event.key==='Enter')setupPw()">
      <button class="btn primary" onclick="setupPw()">Sett passord og åpne</button>`;
  } else {
    // Normal unlock
    desc.textContent=faceIdAvailable&&faceIdRegistered?'Lås opp med Face ID eller passord.':'Skriv inn passordet ditt.';
    if(faceIdAvailable&&faceIdRegistered){
      faceSection.innerHTML=`
        <button class="faceid-btn" onclick="unlockWithFaceId()">
          <span style="font-size:24px">🔐</span> Lås opp med Face ID
        </button>
        <div class="lock-divider">eller</div>`;
      // Auto-trigger Face ID
      setTimeout(()=>unlockWithFaceId(),300);
    }
    pwSection.innerHTML=`
      <input type="password" id="pw-input" placeholder="Passord" onkeydown="if(event.key==='Enter')submitPw()">
      <button class="btn primary" onclick="submitPw()">Lås opp</button>`;
  }
}

async function setupPw(){
  const pw=document.getElementById('pw-input')?.value?.trim();
  const errEl=document.getElementById('lock-error');
  if(!pw||pw.length<4){errEl.textContent='Passordet må være minst 4 tegn.';return;}
  localStorage.setItem(LS_PW,simpleHash(pw));
  // Offer Face ID registration right after
  if(faceIdAvailable){
    const want=confirm('Vil du bruke Face ID til å låse opp appen?');
    if(want){await registerFaceId();}
  }
  unlock();
}

async function unlockWithFaceId(){
  document.getElementById('lock-error').textContent='';
  const ok=await verifyFaceId();
  if(ok){unlock();}
  else{document.getElementById('lock-error').textContent='Face ID mislyktes. Bruk passord.';}
}

function submitPw(){
  const pw=document.getElementById('pw-input')?.value?.trim();
  const errEl=document.getElementById('lock-error');
  errEl.textContent='';
  if(!pw){errEl.textContent='Skriv inn passordet ditt.';return;}
  const stored=localStorage.getItem(LS_PW);
  if(simpleHash(pw)===stored){unlock();}
  else{errEl.textContent='Feil passord. Prøv igjen.';document.getElementById('pw-input').value='';}
}

function unlock(){
  unlocked=true;
  loadData();
  document.getElementById('lockscreen').style.display='none';
  document.getElementById('main-app').style.display='block';
  buildMonthPicker();
  render();
}

function lockApp(){
  unlocked=false;
  document.getElementById('main-app').style.display='none';
  document.getElementById('lockscreen').style.display='flex';
  document.getElementById('lock-error').textContent='';
  initLockScreen();
}

// ── DATA ──────────────────────────────────────────────────────────────────
const CATS=[
  {id:'lan',label:'Lån',color:'#185FA5',bg:'#E6F1FB'},
  {id:'bolig',label:'Bolig',color:'#3B6D11',bg:'#EAF3DE'},
  {id:'bil',label:'Bil',color:'#854F0B',bg:'#FAEEDA'},
  {id:'underholdning',label:'Underholdning',color:'#534AB7',bg:'#EEEDFE'},
  {id:'felles',label:'Felleskonto',color:'#0F6E56',bg:'#E1F5EE'},
  {id:'sparing',label:'Sparing',color:'#993556',bg:'#FBEAF0'},
  {id:'variable',label:'Variabel',color:'#5F5E5A',bg:'#F1EFE8'},
];
const SPARE_KONTOER=['Bufferkonto','BSU','Fondskonto'];
const MONTHS_NO=['Januar','Februar','Mars','April','Mai','Juni','Juli','August','September','Oktober','November','Desember'];
const TODAY=new Date();
let DATA={months:{}};

function loadData(){
  try{const raw=localStorage.getItem(LS_DATA);if(raw) DATA=JSON.parse(raw);}catch{}
}
function saveData(){
  try{localStorage.setItem(LS_DATA,JSON.stringify(DATA));}catch{}
}

function mk(y,m){return`${y}-${String(m).padStart(2,'0')}`;}
function getMonth(y,m){
  const k=mk(y,m);
  if(!DATA.months[k]) DATA.months[k]={lonn:null,entries:[],accounts:{brukskonto:null,bufferkonto:null,bsu:null},autoFond:true};
  const mo=DATA.months[k];
  if(mo.autoFond===undefined) mo.autoFond=true;
  if(!mo.accounts) mo.accounts={brukskonto:null,bufferkonto:null,bsu:null};
  return mo;
}
function fmtNOK(n){if(n===null||n===undefined||n==='')return'—';return Math.round(n).toLocaleString('nb-NO')+'\u00a0kr';}
function fmtDate(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}.${m}.${y.slice(2)}`;}
function toInput(s){if(!s)return'';const p=s.split('.');if(p.length===3)return`20${p[2]}-${p[1]}-${p[0]}`;return s;}
function badge(catId){const c=CATS.find(x=>x.id===catId)||CATS[6];return`<span class="badge" style="background:${c.bg};color:${c.color}">${c.label}</span>`;}

// ── STATE ─────────────────────────────────────────────────────────────────
let curY=TODAY.getFullYear(),curM=TODAY.getMonth()+1,curTab='oversikt';
let editLonnMode=false,editLonnVal='';
let editAccMode={brukskonto:false,bufferkonto:false,bsu:false};
let editAccVal={brukskonto:'',bufferkonto:'',bsu:''};
let inlineEditId=null,inlineAmt='',inlineDate='';
let formData={name:'',amount:'',date:'',cat:'lan',spareKonto:'Bufferkonto'};

// ── CALC ──────────────────────────────────────────────────────────────────
function calcMonth(y,m){
  const mo=getMonth(y,m);
  const entries=mo.entries||[];
  const lonn=mo.lonn||0;
  const autoFond=mo.autoFond!==false;
  const totalAvsatt=entries.reduce((s,e)=>s+(e.avsatt||0),0)+(autoFond?1000:0);
  const sparingEntries=entries.filter(e=>e.cat==='sparing');
  const bufferSpart=sparingEntries.filter(e=>e.spareKonto==='Bufferkonto').reduce((s,e)=>s+(e.avsatt||0),0);
  const bsuSpart=sparingEntries.filter(e=>e.spareKonto==='BSU').reduce((s,e)=>s+(e.avsatt||0),0);
  const fondSpart=sparingEntries.filter(e=>e.spareKonto==='Fondskonto').reduce((s,e)=>s+(e.avsatt||0),0)+(autoFond?1000:0);
  const acc=mo.accounts||{};
  const bruksStart=acc.brukskonto||0;
  const bufferStart=acc.bufferkonto||0;
  const bsuStart=acc.bsu||0;
  const realEntries=entries.filter(e=>e.realKost!==null&&e.realKost!==undefined);
  const totalReal=realEntries.reduce((s,e)=>s+(e.realKost||0),0)+(autoFond?1000:0);
  return{totalAvsatt,totalReal,lonn,igjen:lonn-totalAvsatt,bufferSpart,bsuSpart,fondSpart,
    bruksStart,bufferStart,bsuStart,
    bruksSlut:bruksStart+lonn-totalAvsatt,
    bufferSlut:bufferStart+bufferSpart,
    bsuSlut:bsuStart+bsuSpart,
    entries,sparingEntries,autoFond};
}

// ── OVERSIKT ──────────────────────────────────────────────────────────────
function renderOversikt(){
  const c=calcMonth(curY,curM);
  const mo=getMonth(curY,curM);
  const catSums=CATS.map(cat=>{
    const ces=c.entries.filter(e=>e.cat===cat.id);
    const avsatt=ces.reduce((s,e)=>s+(e.avsatt||0),0);
    const realCes=ces.filter(e=>e.realKost!==null&&e.realKost!==undefined);
    const real=realCes.reduce((s,e)=>s+(e.realKost||0),0);
    return{...cat,avsatt,real,hasReal:realCes.length>0,count:ces.length};
  }).filter(x=>x.count>0||(x.id==='sparing'&&c.autoFond));
  let fondRow=catSums.find(x=>x.id==='sparing');
  if(c.autoFond&&fondRow){fondRow.avsatt+=1000;if(fondRow.hasReal)fondRow.real+=1000;}
  else if(c.autoFond&&!fondRow){catSums.push({...CATS[5],avsatt:1000,real:1000,hasReal:true,count:1});}
  return`
  <div class="metric-grid">
    <div class="metric"><div class="metric-label">Lønn (forrige mnd)</div><div class="metric-value">${fmtNOK(mo.lonn)}</div></div>
    <div class="metric"><div class="metric-label">Totalt avsatt</div><div class="metric-value amber">${fmtNOK(c.totalAvsatt||null)}</div></div>
    <div class="metric"><div class="metric-label">Igjen etter avsetning</div><div class="metric-value ${c.igjen>=0?'green':'red'}">${fmtNOK(c.igjen||null)}</div></div>
    <div class="metric"><div class="metric-label">Reel kost (så langt)</div><div class="metric-value">${fmtNOK(c.totalReal||null)}</div></div>
  </div>
  <div class="accounts-grid">
    <div class="account-card"><div class="acc-name">Brukskonto</div><div class="acc-bal">${fmtNOK(c.bruksSlut||null)}</div><div class="acc-sub">Start: ${fmtNOK(c.bruksStart||null)}</div></div>
    <div class="account-card"><div class="acc-name">Bufferkonto</div><div class="acc-bal green">${fmtNOK(c.bufferSlut||null)}</div><div class="acc-sub">Start: ${fmtNOK(c.bufferStart||null)}${c.bufferSpart?' · +'+fmtNOK(c.bufferSpart):''}</div></div>
    <div class="account-card"><div class="acc-name">BSU</div><div class="acc-bal blue">${fmtNOK(c.bsuSlut||null)}</div><div class="acc-sub">Start: ${fmtNOK(c.bsuStart||null)}${c.bsuSpart?' · +'+fmtNOK(c.bsuSpart):''}</div></div>
    <div class="account-card"><div class="acc-name">Fond (investert)</div><div class="acc-bal purple">${fmtNOK(c.fondSpart||null)}</div><div class="acc-sub">Denne måneden</div></div>
  </div>
  ${catSums.length===0?`<div class="empty-state">Ingen avsetninger registrert.</div>`:`
  <div class="card" style="padding:0"><table>
    <thead><tr><th>Kategori</th><th style="text-align:right">Avsatt</th><th style="text-align:right">Reel kost</th><th style="text-align:right">Differanse</th></tr></thead>
    <tbody>${catSums.map(cat=>{const diff=cat.hasReal?cat.real-cat.avsatt:null;return`<tr>
      <td>${badge(cat.id)}</td><td style="text-align:right">${fmtNOK(cat.avsatt)}</td>
      <td style="text-align:right">${cat.hasReal?fmtNOK(cat.real):'—'}</td>
      <td style="text-align:right">${diff===null?'—':`<span class="${diff>0?'diff-pos':'diff-neg'}">${diff>0?'+':''}${Math.round(diff).toLocaleString('nb-NO')} kr</span>`}</td>
    </tr>`;}).join('')}</tbody>
  </table></div>`}`;
}

// ── AVSETNINGER ───────────────────────────────────────────────────────────
function renderAvsetninger(){
  const mo=getMonth(curY,curM);
  const entries=mo.entries||[];
  const lonnBar=`<div class="lønn-bar">
    <span style="font-size:13px;color:#888">Lønn mottatt (20. forrige mnd):</span>
    ${editLonnMode
      ?`<input type="number" id="lonn-inp" value="${editLonnVal}" placeholder="eks. 45000" style="width:150px">
         <button class="btn primary sm" onclick="saveLonn()">Lagre</button>
         <button class="btn sm" onclick="editLonnMode=false;render()">Avbryt</button>`
      :`<span style="font-size:17px;font-weight:500">${mo.lonn?fmtNOK(mo.lonn):'Ikke lagt inn'}</span>
        <button class="btn sm" onclick="startEditLonn()">✏️ ${mo.lonn?'Endre':'Legg inn'}</button>`}
  </div>`;
  const autoBar=`<div class="auto-trekk-bar">
    <label>Automatisk fondstrekk 1 000 kr/mnd:</label>
    <label class="toggle">
      <input type="checkbox" ${mo.autoFond!==false?'checked':''} onchange="toggleAutoFond(this.checked)">
      <span>${mo.autoFond!==false?'Aktiv':'Pauset'}</span>
    </label>
  </div>`;
  const formSection=`<div class="card">
    <div class="card-title">Ny avsetning</div>
    <div class="form-grid g3">
      <div class="field"><label class="field-label">Navn</label><input id="f-name" value="${formData.name}" oninput="formData.name=this.value" placeholder="eks. Billån"></div>
      <div class="field"><label class="field-label">Beløp (kr)</label><input type="number" id="f-amt" value="${formData.amount}" oninput="formData.amount=this.value" placeholder="4000"></div>
      <div class="field"><label class="field-label">Dato avsatt</label><input type="date" id="f-date" value="${formData.date}" oninput="formData.date=this.value"></div>
    </div>
    <div class="form-grid g2">
      <div class="field"><label class="field-label">Kategori</label>
        <select id="f-cat" onchange="formData.cat=this.value;render()">
          ${CATS.map(c=>`<option value="${c.id}" ${formData.cat===c.id?'selected':''}>${c.label}</option>`).join('')}
        </select></div>
      ${formData.cat==='sparing'?`<div class="field"><label class="field-label">Sparekonto</label>
        <select id="f-konto" onchange="formData.spareKonto=this.value">
          ${SPARE_KONTOER.map(k=>`<option value="${k}" ${formData.spareKonto===k?'selected':''}>${k}</option>`).join('')}
        </select></div>`:`<div></div>`}
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:8px">
      <button class="btn primary" onclick="addEntry()">+ Legg til</button>
    </div>
  </div>`;
  const rows=entries.map(e=>{
    const isEdit=inlineEditId===e.id;
    const diff=(e.realKost!==null&&e.realKost!==undefined)?e.realKost-e.avsatt:null;
    const realCell=isEdit
      ?`<div class="inline-edit">
          <input type="number" value="${inlineAmt}" oninput="inlineAmt=this.value" placeholder="beløp" style="width:85px">
          <input type="date" value="${inlineDate}" oninput="inlineDate=this.value" style="width:130px">
          <button class="btn primary sm" onclick="saveInline(${e.id})">OK</button>
          <button class="btn sm" onclick="inlineEditId=null;render()">✕</button>
        </div>`
      :`<div style="display:flex;align-items:center;gap:6px">
          <span style="color:#888">${(e.realKost!==null&&e.realKost!==undefined)?fmtNOK(e.realKost):'—'}${e.realDato?` <span style="font-size:11px">${e.realDato}</span>`:''}</span>
          ${e.cat!=='sparing'?`<button class="btn sm" onclick="startInline(${e.id})">✏️</button>`:''}
        </div>`;
    return`<tr>
      <td>${badge(e.cat)}${e.cat==='sparing'&&e.spareKonto?` <span class="chip">${e.spareKonto}</span>`:''}</td>
      <td style="font-weight:500;white-space:normal">${e.name}</td>
      <td style="text-align:right">${fmtNOK(e.avsatt)}</td>
      <td style="color:#888;font-size:12px">${e.dato}</td>
      <td>${realCell}</td>
      <td style="text-align:right">${diff===null?'—':`<span class="${diff>0?'diff-pos':'diff-neg'}">${diff>0?'+':''}${Math.round(diff).toLocaleString('nb-NO')}</span>`}</td>
      <td><button class="btn sm danger-outline" onclick="deleteEntry(${e.id})">🗑</button></td>
    </tr>`;
  });
  const autoFondRow=mo.autoFond!==false?`<tr style="background:#fafff8">
    <td>${badge('sparing')} <span class="chip">Fondskonto</span></td>
    <td style="font-weight:500;color:#888">Fast trekk (auto)</td>
    <td style="text-align:right">1 000 kr</td>
    <td style="color:#aaa;font-size:12px">Auto</td>
    <td><span style="color:#1D9E75;font-size:12px">✓ Gjennomført</span></td>
    <td></td><td></td>
  </tr>`:'';
  return`${lonnBar}${autoBar}${formSection}
  ${entries.length===0&&mo.autoFond===false?`<div class="empty-state">Ingen avsetninger ennå.</div>`:`
  <div class="card" style="padding:0;overflow-x:auto"><table>
    <thead><tr><th>Kategori</th><th>Navn</th><th style="text-align:right">Avsatt</th><th>Dato</th><th>Reel kost / dato</th><th style="text-align:right">Diff</th><th></th></tr></thead>
    <tbody>${rows.join('')}${autoFondRow}</tbody>
  </table></div>`}`;
}

// ── KONTOER ───────────────────────────────────────────────────────────────
function renderKontoer(){
  const mo=getMonth(curY,curM);
  const acc=mo.accounts||{};
  function accRow(key,label,color){
    const isEdit=editAccMode[key];
    return`<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:0.5px solid #f0f0f0;flex-wrap:wrap;gap:8px">
      <div><div style="font-size:12px;color:#888">${label}</div>
        ${isEdit?`<div class="acc-input-row" style="margin-top:6px">
          <input type="number" id="acc-${key}" value="${editAccVal[key]}" placeholder="Saldo">
          <button class="btn primary sm" onclick="saveAcc('${key}')">Lagre</button>
          <button class="btn sm" onclick="editAccMode['${key}']=false;render()">Avbryt</button>
        </div>`:`<div style="font-size:18px;font-weight:500;color:${color};margin-top:2px">${fmtNOK(acc[key])}</div>`}
      </div>
      ${!isEdit?`<button class="btn sm" onclick="startEditAcc('${key}','${acc[key]||''}')">✏️ ${acc[key]!==null&&acc[key]!==undefined?'Endre':'Legg inn'}</button>`:''}
    </div>`;
  }
  const c=calcMonth(curY,curM);
  return`
  <div class="card">
    <div class="card-title">Inngående balanse — ${MONTHS_NO[curM-1]} ${curY}</div>
    <p style="font-size:13px;color:#888;margin-bottom:14px">Skriv inn kontosaldo ved starten av måneden.</p>
    ${accRow('brukskonto','Brukskonto','#111')}
    ${accRow('bufferkonto','Bufferkonto','#1D9E75')}
    ${accRow('bsu','BSU','#185FA5')}
    <div style="padding:12px 0"><div style="font-size:12px;color:#888">Fondskonto</div>
    <div style="font-size:13px;color:#aaa;margin-top:4px">Alltid 0 ved månedsstart.</div></div>
  </div>
  <div class="card">
    <div class="card-title">Beregnet sluttsaldo</div>
    <div class="accounts-grid" style="margin:0">
      <div class="account-card"><div class="acc-name">Brukskonto</div><div class="acc-bal">${fmtNOK(c.bruksSlut||null)}</div></div>
      <div class="account-card"><div class="acc-name">Bufferkonto</div><div class="acc-bal green">${fmtNOK(c.bufferSlut||null)}</div></div>
      <div class="account-card"><div class="acc-name">BSU</div><div class="acc-bal blue">${fmtNOK(c.bsuSlut||null)}</div></div>
      <div class="account-card"><div class="acc-name">Fond (investert)</div><div class="acc-bal purple">${fmtNOK(c.fondSpart||null)}</div></div>
    </div>
  </div>`;
}

// ── ÅR ────────────────────────────────────────────────────────────────────
function renderAar(){
  const y=curY;
  let totalBuffer=0,totalBsu=0,totalFond=0,totalSparing=0;
  const rows=[];
  for(let m=1;m<=12;m++){
    const k=mk(y,m);if(!DATA.months[k]) continue;
    const c=calcMonth(y,m);
    if(c.bufferSpart||c.bsuSpart||c.fondSpart){
      totalBuffer+=c.bufferSpart;totalBsu+=c.bsuSpart;totalFond+=c.fondSpart;
      totalSparing+=c.bufferSpart+c.bsuSpart+c.fondSpart;
      rows.push({m,bufferSpart:c.bufferSpart,bsuSpart:c.bsuSpart,fondSpart:c.fondSpart,tot:c.bufferSpart+c.bsuSpart+c.fondSpart});
    }
  }
  return`
  <div class="metric-grid">
    <div class="metric"><div class="metric-label">Totalt spart ${y}</div><div class="metric-value green">${fmtNOK(totalSparing||null)}</div></div>
    <div class="metric"><div class="metric-label">Buffer spart</div><div class="metric-value">${fmtNOK(totalBuffer||null)}</div></div>
    <div class="metric"><div class="metric-label">BSU spart</div><div class="metric-value blue">${fmtNOK(totalBsu||null)}</div></div>
    <div class="metric"><div class="metric-label">Fond investert</div><div class="metric-value purple">${fmtNOK(totalFond||null)}</div></div>
  </div>
  ${rows.length===0?`<div class="empty-state">Ingen sparing registrert for ${y} ennå.</div>`:`
  <div class="card" style="padding:0"><table>
    <thead><tr><th>Måned</th><th style="text-align:right">Bufferkonto</th><th style="text-align:right">BSU</th><th style="text-align:right">Fond</th><th style="text-align:right">Totalt</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td style="font-weight:500">${MONTHS_NO[r.m-1]}</td>
      <td style="text-align:right">${r.bufferSpart?fmtNOK(r.bufferSpart):'—'}</td>
      <td style="text-align:right">${r.bsuSpart?fmtNOK(r.bsuSpart):'—'}</td>
      <td style="text-align:right">${r.fondSpart?fmtNOK(r.fondSpart):'—'}</td>
      <td style="text-align:right;font-weight:500">${fmtNOK(r.tot)}</td>
    </tr>`).join('')}</tbody>
  </table></div>`}`;
}

// ── INNSTILLINGER ─────────────────────────────────────────────────────────
function renderInnstillinger(){
  const hasFaceId=localStorage.getItem(LS_FACEID)==='true';
  return`
  <div class="card">
    <div class="card-title">Sikkerhet</div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:0.5px solid #f0f0f0">
      <div><div style="font-size:14px;font-weight:500">Face ID</div>
      <div style="font-size:12px;color:#888;margin-top:2px">${hasFaceId?'Aktivert':'Ikke satt opp'}</div></div>
      ${faceIdAvailable
        ?hasFaceId
          ?`<button class="btn sm danger-outline" onclick="removeFaceId()">Fjern</button>`
          :`<button class="btn sm primary" onclick="addFaceId()">Sett opp</button>`
        :`<span style="font-size:12px;color:#aaa">Ikke tilgjengelig</span>`}
    </div>
    <div style="padding:10px 0;border-bottom:0.5px solid #f0f0f0">
      <div style="font-size:14px;font-weight:500;margin-bottom:8px">Endre passord</div>
      <div style="display:flex;flex-direction:column;gap:8px;max-width:260px">
        <input type="password" id="new-pw1" placeholder="Nytt passord">
        <input type="password" id="new-pw2" placeholder="Bekreft nytt passord">
        <button class="btn primary sm" style="align-self:flex-start" onclick="changePw()">Endre passord</button>
        <div id="pw-change-msg" style="font-size:12px;min-height:16px"></div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Data</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:14px;font-weight:500">Eksporter backup</div>
        <div style="font-size:12px;color:#888">Last ned alle data som JSON-fil</div></div>
        <button class="btn sm" onclick="exportData()">📤 Eksporter</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:0.5px solid #f0f0f0">
        <div><div style="font-size:14px;font-weight:500">Importer backup</div>
        <div style="font-size:12px;color:#888">Gjenopprett fra JSON-fil</div></div>
        <label class="btn sm" style="cursor:pointer">📥 Importer<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label>
      </div>
    </div>
  </div>`;
}

async function addFaceId(){
  const ok=await registerFaceId();
  if(ok){alert('Face ID er nå satt opp!');}
  else{alert('Kunne ikke sette opp Face ID. Prøv igjen.');}
  render();
}
function removeFaceId(){
  localStorage.removeItem(LS_FACEID);localStorage.removeItem('regnskap_credid');
  faceIdRegistered=false;render();
}
function changePw(){
  const p1=document.getElementById('new-pw1')?.value;
  const p2=document.getElementById('new-pw2')?.value;
  const msg=document.getElementById('pw-change-msg');
  if(!p1||p1.length<4){msg.style.color='#E24B4A';msg.textContent='Minst 4 tegn.';return;}
  if(p1!==p2){msg.style.color='#E24B4A';msg.textContent='Passordene er ikke like.';return;}
  localStorage.setItem(LS_PW,simpleHash(p1));
  msg.style.color='#1D9E75';msg.textContent='Passord endret!';
  document.getElementById('new-pw1').value='';document.getElementById('new-pw2').value='';
}
function exportData(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`regnskap_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const imported=JSON.parse(e.target.result);
      if(!imported.months){alert('Ugyldig fil.');return;}
      if(!confirm('Dette vil overskrive alle eksisterende data. Er du sikker?'))return;
      DATA=imported;saveData();render();alert('Data importert!');
    }catch{alert('Kunne ikke lese filen.');}
  };
  reader.readAsText(file);
}

// ── ACTIONS ───────────────────────────────────────────────────────────────
function startEditLonn(){editLonnMode=true;editLonnVal=getMonth(curY,curM).lonn||'';render();}
function saveLonn(){const v=document.getElementById('lonn-inp')?.value;getMonth(curY,curM).lonn=v?parseFloat(v):null;editLonnMode=false;saveData();render();}
function toggleAutoFond(val){getMonth(curY,curM).autoFond=val;saveData();render();}
function startEditAcc(key,val){editAccMode[key]=true;editAccVal[key]=val;render();}
function saveAcc(key){const v=document.getElementById('acc-'+key)?.value;getMonth(curY,curM).accounts[key]=v?parseFloat(v):null;editAccMode[key]=false;saveData();render();}
function addEntry(){
  const{name,amount,date,cat,spareKonto}=formData;
  if(!name.trim()||!amount||!date) return;
  const mo=getMonth(curY,curM);
  const isSparing=cat==='sparing';
  mo.entries.push({id:Date.now(),name:name.trim(),cat,avsatt:parseFloat(amount),dato:fmtDate(date),
    realKost:isSparing?parseFloat(amount):null,realDato:isSparing?fmtDate(date):null,
    spareKonto:isSparing?spareKonto:null});
  formData={name:'',amount:'',date:'',cat:'lan',spareKonto:'Bufferkonto'};
  saveData();render();
}
function deleteEntry(id){const mo=getMonth(curY,curM);mo.entries=mo.entries.filter(e=>e.id!==id);saveData();render();}
function startInline(id){
  const e=getMonth(curY,curM).entries.find(x=>x.id===id);
  inlineEditId=id;inlineAmt=e.realKost!==null&&e.realKost!==undefined?String(e.realKost):'';
  inlineDate=e.realDato?toInput(e.realDato):'';render();
}
function saveInline(id){
  const e=getMonth(curY,curM).entries.find(x=>x.id===id);
  if(e){e.realKost=inlineAmt!==''?parseFloat(inlineAmt):null;e.realDato=inlineDate?fmtDate(inlineDate):null;}
  inlineEditId=null;saveData();render();
}
function setTab(tab,btn){
  curTab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(btn) btn.classList.add('active');
  editLonnMode=false;inlineEditId=null;render();
}
function changeMonth(val){
  const[y,m]=val.split('-');curY=+y;curM=+m;
  editLonnMode=false;inlineEditId=null;editAccMode={brukskonto:false,bufferkonto:false,bsu:false};render();
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render(){
  if(!unlocked) return;
  document.getElementById('subtitle-month').textContent=`${MONTHS_NO[curM-1]} ${curY}`;
  const c=document.getElementById('content');
  if(curTab==='oversikt') c.innerHTML=renderOversikt();
  else if(curTab==='avsetninger') c.innerHTML=renderAvsetninger();
  else if(curTab==='kontoer') c.innerHTML=renderKontoer();
  else if(curTab==='aar') c.innerHTML=renderAar();
  else if(curTab==='innstillinger') c.innerHTML=renderInnstillinger();
}
function buildMonthPicker(){
  const sel=document.getElementById('month-picker');
  const opts=[];
  for(let y=TODAY.getFullYear();y>=TODAY.getFullYear()-1;y--){
    for(let m=12;m>=1;m--){
      opts.push(`<option value="${y}-${m}" ${y===curY&&m===curM?'selected':''}>${MONTHS_NO[m-1]} ${y}</option>`);
    }
  }
  sel.innerHTML=opts.join('');sel.onchange=e=>changeMonth(e.target.value);
}

// ── SERVICE WORKER ────────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  const swCode=`
    const CACHE='regnskap-v1';
    self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./',location.href]))));
    self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));
  `;
  const blob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

// ── START ─────────────────────────────────────────────────────────────────
initLockScreen();
</script>
</body>
</html>
